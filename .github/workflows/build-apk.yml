name: Build N3MSTORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Project
        run: |
          mkdir -p app
          unzip -o N3MSTORE_Aplikasi_Siap_Build.zip -d app

      - name: Locate Flutter Project
        shell: bash
        run: |
          PROJECT=$(find app -name pubspec.yaml -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "pubspec.yaml tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Generate Android
        run: flutter create . --platforms=android --org com.n3mstore
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build-apk.log
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: N3MSTORE-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N3MSTORE-BUILD-LOG
          path: ${{ env.PROJECT_DIR }}/build-apk.log
          if-no-files-found: ignore
