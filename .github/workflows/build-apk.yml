      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build-apk.log
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N3MSTORE-BUILD-LOG
          path: ${{ env.PROJECT_DIR }}/build-apk.log
          if-no-files-found: ignore
