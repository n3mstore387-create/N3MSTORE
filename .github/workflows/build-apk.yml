steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Find Project ZIP
    run: |
      ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
      if [ -z "$ZIP" ]; then
        echo "File ZIP tidak ditemukan"
        exit 1
      fi
      mkdir -p app
      unzip -o "$ZIP" -d app

  - name: Find Flutter Project
    run: |
      PROJECT=$(find app -name pubspec.yaml -print -quit)
      if [ -z "$PROJECT" ]; then
        echo "pubspec.yaml tidak ditemukan"
        exit 1
      fi
      echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Generate Android
    run: flutter create . --platforms=android --org com.n3mstore
    working-directory: ${{ env.PROJECT_DIR }}

  - name: Install Dependencies
    run: flutter pub get
    working-directory: ${{ env.PROJECT_DIR }}

  - name: Build APK
    run: flutter build apk --release
    working-directory: ${{ env.PROJECT_DIR }}

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: N3MSTORE-APK
      path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
